<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with cream -->
  <circle cx="50" cy="50" r="48" fill="#FAF7F2"/>

  <!-- Stylized "A" with butterfly wings -->
  <!-- Left wing -->
  <path d="M 30 35 Q 20 25 25 40 Q 20 55 35 50"
        fill="none"
        stroke="#E07A5F"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Right wing -->
  <path d="M 70 35 Q 80 25 75 40 Q 80 55 65 50"
        fill="none"
        stroke="#E07A5F"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Letter A -->
  <text x="50" y="72"
        font-family="Georgia, serif"
        font-size="50"
        font-weight="600"
        fill="#2D3436"
        text-anchor="middle">a</text>
</svg>
